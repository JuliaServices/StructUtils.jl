name: Windows trim diagnosis
on:
  pull_request:
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sample: [release, main]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13.0'
          arch: x64
      - uses: actions/cache/restore@v4
        with:
          key: julia-cache;workflow=CI;job=test;os=Windows;version=pre;os=windows-latest;arch=x64;run_id=35421864581;run_attempt=1
          fail-on-cache-miss: true
          path: |
            C:/Users/runneradmin/.julia/artifacts
            C:/Users/runneradmin/.julia/packages
            C:/Users/runneradmin/.julia/registries
            C:/Users/runneradmin/.julia/compiled
            C:/Users/runneradmin/.julia/scratchspaces
            C:/Users/runneradmin/.julia/logs
            !C:/Users/runneradmin/.julia/artifacts/*.pid
            !C:/Users/runneradmin/.julia/artifacts/*.pidfile
            !C:/Users/runneradmin/.julia/compiled/v*.*/*.pid
            !C:/Users/runneradmin/.julia/compiled/v*.*/*.pidfile
            !C:/Users/runneradmin/.julia/compiled/v*.*/*/*.pid
            !C:/Users/runneradmin/.julia/compiled/v*.*/*/*.pidfile
            !C:/Users/runneradmin/.julia/packages/*/*.pid
            !C:/Users/runneradmin/.julia/packages/*/*.pidfile
            !C:/Users/runneradmin/.julia/registries/*/.pid
            !C:/Users/runneradmin/.julia/registries/*/.pidfile
            !C:/Users/runneradmin/.julia/logs/*.pid
            !C:/Users/runneradmin/.julia/logs/*.pidfile
      - name: Install native debugger
        shell: pwsh
        run: |
          $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          if (!(Test-Path $cdb)) {
            $installer = Join-Path $env:RUNNER_TEMP 'winsdksetup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/?linkid=2272610' -OutFile $installer
            $p = Start-Process $installer -ArgumentList '/features','OptionId.WindowsDesktopDebuggers','/quiet','/norestart' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "SDK installer exited $($p.ExitCode)" }
          }
          if (!(Test-Path $cdb)) { throw 'CDB not installed' }
          "TRIM_CDB=$cdb" >> $env:GITHUB_ENV
      - name: Compare startup workloads
        shell: bash
        env:
          JULIA_PKG_SERVER_REGISTRY_PREFERENCE: eager
          TRIM_SOURCE: ${{ matrix.sample }}
        run: julia --startup-file=no --history-file=no test/windows_trim_diagnosis.jl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-trim-diagnosis-${{ matrix.sample }}
          path: trim-diagnosis
